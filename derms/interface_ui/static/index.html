<!doctype html>
<!--
  Interface opérateur du DERMS.
  Page fixe : les données viennent de l'API JSON du serveur (/api/...), lue par app.js.
  Aucune ressource externe : la page fonctionne sans Internet (G-002).
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DERMS EDGECS</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <h1>État du serveur DERMS</h1>
    <p id="resume" class="neutre">Chargement…</p>
    <table>
      <thead>
        <tr><th>Module</th><th>État</th></tr>
      </thead>
      <tbody id="modules"></tbody>
    </table>
    <p id="mise-a-jour" class="neutre"></p>

    <!-- Essai de l'état central : la page est abonnée à la DER 1 et suit chacun de ses changements. -->
    <h2 id="der-nom">DER 1 — en direct</h2>
    <table>
      <tbody>
        <tr><th>SOC</th><td id="der-soc">—</td></tr>
        <tr><th>Puissance voulue</th><td id="der-puissance">—</td></tr>
        <tr><th>Reçu à</th><td id="der-recu">—</td></tr>
      </tbody>
    </table>
    <p id="der-flux" class="neutre">Connexion au flux…</p>
  </body>
</html>
