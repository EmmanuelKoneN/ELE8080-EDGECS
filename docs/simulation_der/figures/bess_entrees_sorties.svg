<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" role="img" aria-label="La passerelle envoie au BESS trois commandes : start, stop et set_active_power. Le BESS renvoie un CommandResult pour chaque commande et un DerTelemetry avec son identité, sa puissance, son SOC, ses états, son alarme et l'heure de la mesure.">
  <title>BESS vu de la passerelle : entrées et sorties</title>
  <style>
    text { font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif; font-size: 13px; fill: #1b2430; }
    .mono { font-family: "IBM Plex Mono", Consolas, "Courier New", monospace; }
    .muted { fill: #5b6675; }
    .title { font-size: 16px; font-weight: 600; }
    .head { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; }
    .box { fill: #ffffff; stroke: #c6cdd7; stroke-width: 1.5; }
    .a-in { stroke: #1d5fb4; stroke-width: 1.8; fill: none; }
    .a-out { stroke: #2b7a4a; stroke-width: 1.8; fill: none; }
    .t-in { fill: #1d5fb4; }
    .t-out { fill: #2b7a4a; }
    .mk-in { fill: #1d5fb4; }
    .mk-out { fill: #2b7a4a; }
  </style>
  <defs>
    <marker id="m-in" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk-in" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="m-out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk-out" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect x="0" y="0" width="900" height="550" fill="#ffffff"/>

  <rect class="box" x="20" y="20" width="170" height="450" rx="6"/>
  <text class="title" x="105" y="250" text-anchor="middle">Passerelle</text>

  <rect class="box" x="710" y="20" width="170" height="450" rx="6"/>
  <text class="title" x="795" y="250" text-anchor="middle">BESS</text>

  <!-- Entrées : passerelle vers BESS -->
  <text class="head t-in" x="210" y="52">ENTRÉES</text>

  <text class="mono t-in" x="210" y="84">start()</text>
  <text class="muted" x="690" y="84" text-anchor="end">démarre le BESS</text>
  <line class="a-in" x1="192" y1="92" x2="706" y2="92" marker-end="url(#m-in)"/>

  <text class="mono t-in" x="210" y="122">stop()</text>
  <text class="muted" x="690" y="122" text-anchor="end">arrête le BESS, P revient à 0</text>
  <line class="a-in" x1="192" y1="130" x2="706" y2="130" marker-end="url(#m-in)"/>

  <text class="mono t-in" x="210" y="160">set_active_power(p_kw)</text>
  <text class="muted" x="690" y="160" text-anchor="end">consigne de puissance, de −100 à +100 kW</text>
  <line class="a-in" x1="192" y1="168" x2="706" y2="168" marker-end="url(#m-in)"/>

  <!-- Sorties : BESS vers passerelle -->
  <text class="head t-out" x="210" y="216">SORTIES</text>

  <line class="a-out" x1="708" y1="232" x2="194" y2="232" marker-end="url(#m-out)"/>
  <text class="mono t-out" x="210" y="252">CommandResult</text>
  <text class="muted" x="690" y="252" text-anchor="end">réponse à chaque commande</text>
  <text class="mono" x="230" y="272">accepted</text>
  <text x="400" y="272">commande appliquée (oui / non)</text>
  <text class="mono" x="230" y="290">reason</text>
  <text x="400" y="290">motif du refus</text>

  <line class="a-out" x1="708" y1="306" x2="194" y2="306" marker-end="url(#m-out)"/>
  <text class="mono t-out" x="210" y="324">DerTelemetry</text>
  <text class="muted" x="690" y="324" text-anchor="end">état du BESS au moment de la lecture</text>
  <text class="mono" x="230" y="344">der_id, der_type</text>
  <text x="400" y="344">identité du DER (der1, bess)</text>
  <text class="mono" x="230" y="362">p_kw</text>
  <text x="400" y="362">puissance active mesurée, kW</text>
  <text class="mono" x="230" y="380">soc_pct</text>
  <text x="400" y="380">état de charge, %</text>
  <text class="mono" x="230" y="398">operational_state</text>
  <text x="400" y="398">RUNNING (marche) / STOPPED (arrêt)</text>
  <text class="mono" x="230" y="416">connection_state</text>
  <text x="400" y="416">CONNECTED / DISCONNECTED</text>
  <text class="mono" x="230" y="434">alarm</text>
  <text x="400" y="434">NONE / SOC_LIMIT / FAULT</text>
  <text class="mono" x="230" y="452">timestamp</text>
  <text x="400" y="452">heure de la mesure, UTC</text>

  <!-- Légende -->
  <text class="muted" x="20" y="506">Convention de signe : P &gt; 0 en décharge (la batterie injecte), P &lt; 0 en charge (elle absorbe).</text>
  <text class="muted" x="20" y="526">SOC_LIMIT : la puissance est réduite pour que le SOC reste entre ses bornes. FAULT : erreur du modèle, le BESS est arrêté.</text>
</svg>
